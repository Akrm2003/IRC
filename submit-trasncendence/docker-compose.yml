services:
  # Backend service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ft_transcendence-backend:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ft_transcendence_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app/backend 
      - /app/node_modules
      - sqlite_data:/app/backend/prisma/
      - uploads_data:/app/backend/uploads/
      - ./ssl:/app/ssl:ro
    command: npm run dev
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Vite dev server - serves everything
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      cache_from:
        - ft_transcendence-frontend:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: ft_transcendence_frontend
    ports:
      - "5173:5173"  # Vite dev server
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./ssl:/app/ssl:ro
    networks:
      - app-network
    restart: unless-stopped

  # Nginx proxy with HTTPS support
  nginx:
    image: nginx:alpine
    container_name: ft_transcendence_nginx
    ports:
      - "8080:80"   # HTTP (redirects to HTTPS)
      - "8443:443"  # HTTPS (main application)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl/certs:/etc/nginx/ssl/certs:ro
      - ./ssl/private:/etc/nginx/ssl/private:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
  uploads_data:
    driver: local