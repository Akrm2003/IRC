<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ping Pong Arena</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base styles */
    body {
        color: white;
        min-height: 100vh;
        position: relative;
    }
    
    /* Background image - fixed to prevent white space on scroll */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('../assets/homepage-bc.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        z-index: -1;
    }
  </style>
</head>
<body class="min-h-screen text-white relative overflow-x-hidden">
  
  <!-- Content overlay -->
  <div class="relative z-10">
    
    <!-- REMOVED: Navigation with "Back to Home" link -->
    <!-- This was a security issue - unauthenticated users shouldn't access home -->

    <!-- Login container -->
    <main class="flex-1 px-4 sm:px-6 lg:px-8 py-8 sm:py-12 min-h-screen flex items-center justify-center">
      <div class="w-full max-w-sm sm:max-w-md mx-auto">
        
        <!-- Login Card -->
        <div class="bg-slate-800/95 backdrop-blur-xl rounded-3xl border border-white/20 shadow-2xl p-8 sm:p-10 lg:p-12 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-3xl">
          
          <!-- Header -->
          <div class="text-center mb-8 sm:mb-10">
            <div class="mb-6">
              <div class="w-20 h-20 mx-auto bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center mb-4 transform transition-all duration-300 hover:rotate-6">
                <span class="text-3xl">🎮</span>
              </div>
            </div>
            <h1 class="text-4xl sm:text-5xl font-bold mb-3 bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 bg-clip-text text-transparent">
              Welcome Back
            </h1>
            <p class="text-slate-300 text-lg sm:text-xl">Sign in to continue your ping pong journey</p>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="space-y-4 sm:space-y-6">
            
            <!-- Email Input -->
            <div class="group">
              <label for="email" class="block text-sm font-semibold text-slate-300 mb-3 group-focus-within:text-blue-400 transition-colors">Email</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <svg class="w-5 h-5 text-slate-400 group-focus-within:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                  </svg>
                </div>
                <input 
                  type="email" 
                  id="email" 
                  name="email" 
                  required 
                  class="w-full pl-12 pr-4 py-4 bg-slate-900/80 border-2 border-slate-600/50 rounded-2xl text-white placeholder-slate-400 focus:outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-400/20 transition-all text-base sm:text-lg"
                  placeholder="Enter your email address"
                  autocomplete="email"
                >
              </div>
            </div>

            <!-- Password Input -->
            <div class="group">
              <label for="password" class="block text-sm font-semibold text-slate-300 mb-3 group-focus-within:text-blue-400 transition-colors">Password</label>
              <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                  <svg class="w-5 h-5 text-slate-400 group-focus-within:text-blue-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                  </svg>
                </div>
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  required 
                  class="w-full pl-12 pr-4 py-4 bg-slate-900/80 border-2 border-slate-600/50 rounded-2xl text-white placeholder-slate-400 focus:outline-none focus:border-blue-400 focus:ring-4 focus:ring-blue-400/20 transition-all text-base sm:text-lg"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                >
              </div>
            </div>

            <!-- Login Button -->
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-500 via-purple-600 to-pink-600 hover:from-blue-600 hover:via-purple-700 hover:to-pink-700 text-white font-bold py-4 sm:py-5 px-6 rounded-2xl transition-all duration-300 transform hover:scale-105 hover:shadow-2xl text-base sm:text-lg shadow-xl border border-blue-400/30">
              <span class="flex items-center justify-center">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                </svg>
                Sign In to Arena
              </span>
            </button>

            <!-- OR Divider -->
            <div class="relative my-4 sm:my-6">
              <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-slate-600"></div>
              </div>
              <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-transparent text-slate-400">OR</span>
              </div>
            </div>

            <!-- Google OAuth Button -->
            <a href="http://localhost:8080/auth/google" 
              class="w-full bg-white/95 hover:bg-white text-gray-700 font-bold py-4 sm:py-5 px-6 rounded-2xl border-2 border-gray-200/50 transition-all duration-300 transform hover:scale-105 hover:shadow-2xl flex items-center justify-center text-base sm:text-lg shadow-lg group">
              <svg class="w-6 h-6 mr-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Continue with Google
            </a>

          </form>

          <!-- Register Link -->
          <div class="text-center mt-6 sm:mt-8">
            <p class="text-slate-400 text-base sm:text-lg">
              Don't have an account? 
              <a href="register.html" class="text-blue-400 hover:text-blue-300 transition-all duration-300 font-semibold hover:underline decoration-2 underline-offset-4">
                Create Account
              </a>
            </p>
          </div>

        </div>

      </div>
    </main>
  </div>

  <script type="module" src="/src/auth/authHandler.ts"></script>
</body>
</html>
