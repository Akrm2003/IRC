<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup 2FA | Ping Pong Game</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base styles */
    body {
        color: white;
        min-height: 100vh;
        position: relative;
    }
    
    /* Background image - fixed to prevent white space on scroll */
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('../assets/homepage-bc.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        z-index: -1;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">
    <!-- Loading State -->
    <div id="loadingState" class="text-center text-white">
        <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-white mx-auto mb-4"></div>
        <p class="text-lg">Setting up your 2FA...</p>
    </div>

    <!-- QR Setup Content -->
    <div id="qrSetupContent" class="hidden bg-gray-800/50 backdrop-blur-sm border border-gray-700 rounded-xl p-8 max-w-md w-full">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-white mb-2">Set Up Two-Factor Authentication</h2>
            <p class="text-gray-300">Scan this QR code with your authenticator app</p>
        </div>

        <!-- QR Code Display -->
        <div class="flex justify-center mb-6">
            <img id="qrCodeImage" alt="QR Code" class="w-64 h-64 bg-white p-4 rounded-lg">
        </div>

        <!-- Verification Form -->
        <form id="verifyForm" class="space-y-4">
            <div>
                <label for="code" class="block text-sm font-medium text-gray-300 mb-2">Verification Code</label>
                <input type="text" id="code" name="code" 
                       class="w-full bg-gray-700 border border-gray-600 text-white px-4 py-2 rounded-lg focus:ring-2 focus:ring-blue-500"
                       placeholder="Enter 6-digit code" maxlength="6" pattern="[0-9]{6}" required>
            </div>
            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300">
                Verify & Complete Setup
            </button>
        </form>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden text-center text-red-500">
        <p id="errorMessage"></p>
    </div>

    <script type="module" src="../src/auth/qrSetupHandler.ts"></script>
</body>
</html>
