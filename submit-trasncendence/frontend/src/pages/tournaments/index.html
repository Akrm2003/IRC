<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments - Ping Pong Arena</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏓</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tournament-card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .tournament-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border-color: rgba(99, 102, 241, 0.5);
    }
    
    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
    }
    
    .status-upcoming {
      background-color: rgba(234, 179, 8, 0.1);
      color: rgb(234, 179, 8);
    }
    
    .status-in-progress {
      background-color: rgba(59, 130, 246, 0.1);
      color: rgb(59, 130, 246);
    }
    
    .status-completed {
      background-color: rgba(34, 197, 94, 0.1);
      color: rgb(34, 197, 94);
    }
    
    body {
      background: radial-gradient(ellipse at top, rgba(30, 41, 59, 0.3) 0%, rgba(15, 23, 42, 0.4) 100%);
      min-height: 100vh;
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .nav-link {
      position: relative;
      padding-bottom: 0.5rem;
    }
    
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transition: width 0.3s ease;
    }
    
    .nav-link:hover::after {
      width: 100%;
    }
    
    .nav-link.active {
      color: #818cf8;
    }
    
    .nav-link.active::after {
      width: 100%;
    }
  </style>
</head>
<body class="min-h-screen text-white relative overflow-x-hidden">
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center">
    <div class="text-center">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto mb-4"></div>
      <p class="text-white">Loading tournaments...</p>
    </div>
  </div>

  <!-- Background Elements -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute w-96 h-96 bg-indigo-500/5 rounded-full -top-48 -left-48"></div>
    <div class="absolute w-96 h-96 bg-purple-500/5 rounded-full -bottom-48 -right-48"></div>
  </div>
  
  <!-- Content -->
  <div class="relative z-10 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-slate-800/70 backdrop-blur-md px-4 sm:px-8 py-5 border-b border-slate-700/50 shadow-xl">
      <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 sm:gap-0">
        <div class="flex items-center">
          <a href="/home/home.html" class="text-2xl font-bold text-white flex items-center group transition-all duration-300">
            <span class="mr-3 text-3xl group-hover:scale-110 transition-transform duration-300">🏓</span> 
            <span class="gradient-text">Ping Pong Arena</span>
          </a>
        </div>
        
        <div class="flex items-center gap-6">
          <a href="/home/home.html" class="nav-link text-slate-300 hover:text-white transition-colors">Home</a>
          <a href="/friends/friends.html" class="nav-link text-slate-300 hover:text-white transition-colors">Friends</a>
          <a href="/profile/profile.html" class="nav-link text-slate-300 hover:text-white transition-colors">Profile</a>
          <a href="/tournaments/tournaments.html" class="nav-link active text-indigo-400 font-medium">Tournaments</a>
          
          <button id="logoutBtn" class="ml-4 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white px-4 py-2 rounded-lg transition-all duration-300 shadow hover:shadow-lg">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
      <div class="flex flex-col md:flex-row gap-8">
        <!-- Left Sidebar -->
        <div class="w-full md:w-1/3 lg:w-1/4">
          <div class="bg-slate-800/50 backdrop-blur-lg rounded-xl p-6 shadow-lg border border-slate-700/50">
            <h2 class="text-xl font-bold text-white mb-6">Tournaments</h2>
            
            <button id="createTournamentBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-medium py-3 px-4 rounded-lg transition-all duration-300 shadow-lg hover:shadow-xl flex items-center justify-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
              </svg>
              Create Tournament
            </button>
            
            <div class="mt-6">
              <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Filter</h3>
              <div class="space-y-2">
                <button class="filter-btn w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-white" data-filter="all">
                  All Tournaments
                </button>
                <button class="filter-btn w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-slate-300" data-filter="upcoming">
                  Upcoming
                </button>
                <button class="filter-btn w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-slate-300" data-filter="in-progress">
                  In Progress
                </button>
                <button class="filter-btn w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-slate-300" data-filter="completed">
                  Completed
                </button>
                <button class="filter-btn w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-slate-300" data-filter="my-tournaments">
                  My Tournaments
                </button>
              </div>
            </div>
            
            <div class="mt-8">
              <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Quick Actions</h3>
              <div class="space-y-2">
                <button id="joinTournamentBtn" class="w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-slate-300 flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                  </svg>
                  Join Tournament
                </button>
                <button id="viewBracketsBtn" class="w-full text-left px-3 py-2 rounded-lg transition-colors hover:bg-slate-700/50 text-slate-300 flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                  </svg>
                  View All Brackets
                </button>
              </div>
            </div>
          </div>
          
          <div class="mt-6 bg-slate-800/50 backdrop-blur-lg rounded-xl p-6 shadow-lg border border-slate-700/50">
            <h3 class="text-lg font-semibold text-white mb-4">Upcoming Matches</h3>
            <div id="upcomingMatches" class="space-y-4">
              <!-- Upcoming matches will be loaded here -->
              <div class="text-center py-4 text-slate-400">
                <p>No upcoming matches</p>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Main Content -->
        <div class="flex-1">
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
              <h1 class="text-2xl sm:text-3xl font-bold text-white">Tournaments</h1>
              <p class="text-slate-400 mt-1">Compete in exciting ping pong tournaments</p>
            </div>
            
            <div class="relative w-full md:w-auto">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-5 w-5 text-slate-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                </svg>
              </div>
              <input 
                type="text" 
                id="searchTournaments" 
                class="block w-full pl-10 pr-3 py-2 border border-slate-700 rounded-lg bg-slate-800/50 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" 
                placeholder="Search tournaments..."
              >
            </div>
          </div>
          
          <!-- Tournaments List -->
          <div id="tournamentsList" class="space-y-4">
            <!-- Tournaments will be loaded here by JavaScript -->
            <div class="text-center py-12 text-slate-500">
              <svg class="mx-auto h-12 w-12 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
              </svg>
              <h3 class="mt-2 text-lg font-medium text-white">No tournaments yet</h3>
              <p class="mt-1 text-slate-400">Create your first tournament to get started!</p>
              <div class="mt-6">
                <button id="createFirstTournamentBtn" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                  <svg class="-ml-1 mr-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                  </svg>
                  New Tournament
                </button>
              </div>
            </div>
          </div>
          
          <!-- Tournament Detail View (Hidden by default) -->
          <div id="tournamentDetailView" class="hidden">
            <!-- Will be populated by JavaScript -->
          </div>
          
          <!-- Create Tournament Form (Hidden by default) -->
          <div id="createTournamentForm" class="hidden bg-slate-800/50 backdrop-blur-lg rounded-xl p-6 shadow-lg border border-slate-700/50">
            <div class="flex justify-between items-center mb-6">
              <h2 class="text-xl font-bold text-white">Create New Tournament</h2>
              <button id="closeCreateForm" class="text-slate-400 hover:text-white">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
            
            <form id="newTournamentForm" class="space-y-4">
              <div>
                <label for="tournamentName" class="block text-sm font-medium text-slate-300 mb-1">Tournament Name</label>
                <input 
                  type="text" 
                  id="tournamentName" 
                  name="tournamentName" 
                  required
                  class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                  placeholder="e.g., Weekend Showdown"
                >
              </div>
              
              <div>
                <label for="tournamentGame" class="block text-sm font-medium text-slate-300 mb-1">Game Type</label>
                <select 
                  id="tournamentGame" 
                  name="tournamentGame" 
                  class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                >
                  <option value="ping-pong">Ping Pong</option>
                  <option value="table-tennis" disabled>Table Tennis (Coming Soon)</option>
                  <option value="foosball" disabled>Foosball (Coming Soon)</option>
                </select>
              </div>
              
              <div>
                <label for="tournamentType" class="block text-sm font-medium text-slate-300 mb-1">Tournament Type</label>
                <select 
                  id="tournamentType" 
                  name="tournamentType" 
                  class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                >
                  <option value="single-elimination">Single Elimination</option>
                  <option value="double-elimination" disabled>Double Elimination (Coming Soon)</option>
                  <option value="round-robin" disabled>Round Robin (Coming Soon)</option>
                </select>
              </div>
              
              <div>
                <label for="tournamentPlayers" class="block text-sm font-medium text-slate-300 mb-1">Number of Players</label>
                <select 
                  id="tournamentPlayers" 
                  name="tournamentPlayers" 
                  class="w-full px-3 py-2 bg-slate-700/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                >
                  <option value="4">4 Players</option>
                  <option value="8">8 Players</option>
                  <option value="16">16 Players</option>
                  <option value="32">32 Players</option>
                </select>
              </div>
              
              <div class="pt-2">
                <button 
                  type="submit" 
                  class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                >
                  Create Tournament
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script type="module" src="/src/pages/tournaments/index.ts"></script>
</body>
</html>
